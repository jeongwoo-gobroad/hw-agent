# A single backend owns camera and indexing; each entry point sets its trust scope.
server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    access_log off;
    client_max_body_size 2m;
    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Alter-Exposure public;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $alter_scheme;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }
}
server {
    listen 11977;
    server_name _;
    allow 127.0.0.1;
    allow 192.168.0.0/24;
    deny all;
    access_log off;
    client_max_body_size 2m;
    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Alter-Exposure internal;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }
}
